<!DOCTYPE html>
<html>
<head><title>Icon Generator</title></head>
<body>
<canvas id="c192" width="192" height="192"></canvas>
<canvas id="c512" width="512" height="512"></canvas>
<br>
<button onclick="download('c192','icon-192.png')">Download icon-192.png</button>
<button onclick="download('c512','icon-512.png')">Download icon-512.png</button>

<script>
function drawIcon(id) {
  const canvas = document.getElementById(id);
  const size = canvas.width;
  const ctx = canvas.getContext('2d');
  const r = size * 0.18;

  // Background
  ctx.fillStyle = '#1a1d27';
  ctx.beginPath();
  ctx.roundRect(0, 0, size, size, r);
  ctx.fill();

  // Circle accent
  ctx.fillStyle = '#6c63ff22';
  ctx.beginPath();
  ctx.arc(size * 0.78, size * 0.22, size * 0.28, 0, Math.PI * 2);
  ctx.fill();

  // Dollar sign
  ctx.fillStyle = '#3ecf8e';
  ctx.font = `bold ${size * 0.52}px system-ui, -apple-system, sans-serif`;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText('$', size / 2, size / 2 + size * 0.03);
}

function download(id, filename) {
  drawIcon(id);
  const a = document.createElement('a');
  a.href = document.getElementById(id).toDataURL('image/png');
  a.download = filename;
  a.click();
}

drawIcon('c192');
drawIcon('c512');
</script>
</body>
</html>
