<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Daily Budget Tracker</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0f1117;
      --surface: #1a1d27;
      --surface2: #22263a;
      --accent: #6c63ff;
      --accent-light: #a89cff;
      --green: #3ecf8e;
      --red: #ff5e5e;
      --yellow: #f5c542;
      --text: #e2e8f0;
      --muted: #7c85a2;
      --border: #2e3450;
      --radius: 12px;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 24px 16px 60px;
    }

    h1 {
      font-size: 1.6rem;
      font-weight: 700;
      letter-spacing: -0.5px;
      color: var(--accent-light);
      margin-bottom: 4px;
    }

    .subtitle {
      font-size: 0.85rem;
      color: var(--muted);
      margin-bottom: 28px;
    }

    .app {
      width: 100%;
      max-width: 480px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    /* Balance Card */
    .balance-card {
      background: linear-gradient(135deg, #2a2468 0%, #1a1d27 100%);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 24px;
      text-align: center;
      position: relative;
      overflow: hidden;
    }

    .balance-card::before {
      content: '';
      position: absolute;
      top: -40px; right: -40px;
      width: 140px; height: 140px;
      background: var(--accent);
      opacity: 0.08;
      border-radius: 50%;
    }

    .balance-label {
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      color: var(--muted);
      margin-bottom: 8px;
    }

    .balance-amount {
      font-size: 3rem;
      font-weight: 800;
      letter-spacing: -1px;
      transition: color 0.3s;
    }

    .balance-amount.good  { color: var(--green); }
    .balance-amount.warn  { color: var(--yellow); }
    .balance-amount.over  { color: var(--red); }

    .balance-meta {
      display: flex;
      justify-content: center;
      gap: 20px;
      margin-top: 14px;
    }

    .meta-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
    }

    .meta-value {
      font-size: 0.95rem;
      font-weight: 600;
      color: var(--text);
    }

    .meta-label {
      font-size: 0.7rem;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .divider-v {
      width: 1px;
      background: var(--border);
      align-self: stretch;
    }

    /* Progress bar */
    .progress-wrap {
      margin-top: 16px;
      background: var(--surface2);
      border-radius: 99px;
      height: 8px;
      overflow: hidden;
    }

    .progress-bar {
      height: 100%;
      border-radius: 99px;
      transition: width 0.4s ease, background 0.3s;
    }

    /* Add expense */
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 20px;
    }

    .card-title {
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 1.2px;
      color: var(--muted);
      margin-bottom: 14px;
    }

    .input-row {
      display: flex;
      gap: 10px;
    }

    .input-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
      flex: 1;
    }

    .input-group label {
      font-size: 0.75rem;
      color: var(--muted);
    }

    input[type="number"],
    input[type="text"] {
      width: 100%;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      padding: 10px 12px;
      font-size: 0.95rem;
      outline: none;
      transition: border-color 0.2s;
    }

    input[type="number"]:focus,
    input[type="text"]:focus {
      border-color: var(--accent);
    }

    input[type="number"] { max-width: 120px; }

    .btn {
      padding: 10px 20px;
      border-radius: 8px;
      border: none;
      cursor: pointer;
      font-size: 0.9rem;
      font-weight: 600;
      transition: opacity 0.2s, transform 0.1s;
      align-self: flex-end;
    }

    .btn:active { transform: scale(0.97); }
    .btn:hover  { opacity: 0.9; }

    .btn-primary {
      background: var(--accent);
      color: #fff;
    }

    .btn-danger {
      background: transparent;
      border: 1px solid var(--red);
      color: var(--red);
      padding: 6px 12px;
      font-size: 0.78rem;
    }

    /* Day selector */
    .day-nav {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .day-nav span {
      font-size: 0.9rem;
      font-weight: 600;
      color: var(--text);
      flex: 1;
      text-align: center;
    }

    .btn-nav {
      background: var(--surface2);
      border: 1px solid var(--border);
      color: var(--text);
      border-radius: 8px;
      width: 34px; height: 34px;
      font-size: 1rem;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      transition: background 0.2s;
    }

    .btn-nav:hover { background: var(--border); }
    .btn-nav:disabled { opacity: 0.35; cursor: default; }

    /* Transaction list */
    .tx-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
      max-height: 320px;
      overflow-y: auto;
    }

    .tx-list::-webkit-scrollbar { width: 4px; }
    .tx-list::-webkit-scrollbar-track { background: transparent; }
    .tx-list::-webkit-scrollbar-thumb { background: var(--border); border-radius: 99px; }

    .tx-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      background: var(--surface2);
      border-radius: 8px;
      padding: 10px 14px;
      animation: fadeIn 0.2s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(-4px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .tx-info { flex: 1; min-width: 0; }

    .tx-desc {
      font-size: 0.9rem;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .tx-time {
      font-size: 0.7rem;
      color: var(--muted);
      margin-top: 2px;
    }

    .tx-amount {
      font-size: 1rem;
      font-weight: 700;
      color: var(--red);
      white-space: nowrap;
    }

    .tx-rollover .tx-amount { color: var(--green); }

    .empty-state {
      text-align: center;
      color: var(--muted);
      font-size: 0.85rem;
      padding: 24px 0;
    }

    /* Summary strip */
    .summary-strip {
      display: flex;
      gap: 8px;
    }

    .strip-item {
      flex: 1;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 14px;
      text-align: center;
    }

    .strip-value {
      font-size: 1.15rem;
      font-weight: 700;
    }

    .strip-label {
      font-size: 0.68rem;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--muted);
      margin-top: 3px;
    }

    .toast {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%) translateY(80px);
      background: var(--surface2);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 10px 20px;
      border-radius: 99px;
      font-size: 0.85rem;
      transition: transform 0.3s ease;
      z-index: 100;
      white-space: nowrap;
    }

    .toast.show { transform: translateX(-50%) translateY(0); }

    .tag-today {
      font-size: 0.68rem;
      background: var(--accent);
      color: #fff;
      border-radius: 99px;
      padding: 2px 8px;
      margin-left: 6px;
      vertical-align: middle;
    }
  </style>
</head>
<body>
  <h1>Daily Budget</h1>
  <p class="subtitle">$45 / day &mdash; unused rolls over</p>

  <div class="app">
    <!-- Balance card -->
    <div class="balance-card">
      <div class="balance-label">Available Today</div>
      <div class="balance-amount good" id="balance">$45.00</div>
      <div class="progress-wrap">
        <div class="progress-bar" id="progress" style="width:0%;background:var(--green)"></div>
      </div>
      <div class="balance-meta">
        <div class="meta-item">
          <span class="meta-value" id="meta-daily">$45.00</span>
          <span class="meta-label">Daily</span>
        </div>
        <div class="divider-v"></div>
        <div class="meta-item">
          <span class="meta-value" id="meta-rollover">+$0.00</span>
          <span class="meta-label">Rollover</span>
        </div>
        <div class="divider-v"></div>
        <div class="meta-item">
          <span class="meta-value" id="meta-spent">$0.00</span>
          <span class="meta-label">Spent</span>
        </div>
      </div>
    </div>

    <!-- Summary strip -->
    <div class="summary-strip">
      <div class="strip-item">
        <div class="strip-value" id="strip-days">1</div>
        <div class="strip-label">Days tracked</div>
      </div>
      <div class="strip-item">
        <div class="strip-value" id="strip-saved" style="color:var(--green)">$0.00</div>
        <div class="strip-label">Total saved</div>
      </div>
      <div class="strip-item">
        <div class="strip-value" id="strip-total-spent">$0.00</div>
        <div class="strip-label">Total spent</div>
      </div>
    </div>

    <!-- Add expense -->
    <div class="card">
      <div class="card-title">Add Expense</div>
      <div class="input-row">
        <div class="input-group">
          <label for="amount-input">Amount ($)</label>
          <input type="number" id="amount-input" placeholder="0.00" min="0.01" step="0.01" />
        </div>
        <div class="input-group" style="flex:2">
          <label for="desc-input">Description (optional)</label>
          <input type="text" id="desc-input" placeholder="e.g. Lunch" maxlength="40" />
        </div>
        <button class="btn btn-primary" onclick="addExpense()" style="margin-bottom:0;align-self:flex-end">Add</button>
      </div>
    </div>

    <!-- Transactions -->
    <div class="card">
      <div class="day-nav">
        <button class="btn-nav" id="btn-prev" onclick="changeDay(-1)">&#8592;</button>
        <span id="day-label">Today</span>
        <button class="btn-nav" id="btn-next" onclick="changeDay(1)" disabled>&#8594;</button>
      </div>
      <div class="card-title" style="margin-top:16px">Transactions</div>
      <div class="tx-list" id="tx-list">
        <div class="empty-state">No expenses yet today.</div>
      </div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script>
    const DAILY = 45;

    // --- State ---
    // data[dateStr] = { spent: [...{amount, desc, time}], rolloverIn: number }
    let data = JSON.parse(localStorage.getItem('budget_data') || '{}');
    let viewOffset = 0; // 0 = today, -1 = yesterday, etc.

    // --- Date helpers ---
    function dateStr(offset = 0) {
      const d = new Date();
      d.setDate(d.getDate() + offset);
      return d.toISOString().slice(0, 10); // YYYY-MM-DD
    }

    function formatDate(str) {
      const [y, m, d] = str.split('-').map(Number);
      return new Date(y, m - 1, d).toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric' });
    }

    function allDatesAsc() {
      return Object.keys(data).sort();
    }

    // --- Rollover computation ---
    // Walks from earliest date to today, computing rollovers forward
    function computeRollovers() {
      const today = dateStr(0);
      const dates = allDatesAsc();

      // Ensure today exists
      if (!data[today]) data[today] = { spent: [], rolloverIn: 0 };

      // Fill gaps between dates and propagate rollovers
      // First pass: collect all dates we care about from earliest to today
      if (dates.length === 0) return;

      const earliest = dates[0];
      const d = new Date(earliest);
      const end   = new Date(today);

      let prev = null;
      while (d <= end) {
        const key = d.toISOString().slice(0, 10);
        if (!data[key]) data[key] = { spent: [], rolloverIn: 0 };

        if (prev !== null) {
          const prevDay = data[prev];
          const prevSpent = prevDay.spent.reduce((s, t) => s + t.amount, 0);
          const prevAvailable = DAILY + prevDay.rolloverIn;
          const prevLeftover = Math.max(0, prevAvailable - prevSpent);
          data[key].rolloverIn = prevLeftover;
        }

        prev = key;
        d.setDate(d.getDate() + 1);
      }
    }

    function save() {
      localStorage.setItem('budget_data', JSON.stringify(data));
    }

    // --- UI ---
    function getViewDate() { return dateStr(viewOffset); }

    function render() {
      const today = dateStr(0);
      computeRollovers();

      const key = getViewDate();
      if (!data[key]) data[key] = { spent: [], rolloverIn: 0 };
      const day = data[key];

      const totalSpent = day.spent.reduce((s, t) => s + t.amount, 0);
      const available  = DAILY + day.rolloverIn - totalSpent;
      const budget     = DAILY + day.rolloverIn;
      const pct        = Math.min(100, (totalSpent / budget) * 100);

      // Balance
      const balEl = document.getElementById('balance');
      balEl.textContent = fmt(available);
      balEl.className = 'balance-amount ' + (available > 15 ? 'good' : available > 0 ? 'warn' : 'over');

      document.getElementById('meta-daily').textContent    = fmt(DAILY);
      document.getElementById('meta-rollover').textContent = '+' + fmt(day.rolloverIn);
      document.getElementById('meta-spent').textContent    = fmt(totalSpent);

      const bar = document.getElementById('progress');
      bar.style.width = pct + '%';
      bar.style.background = pct < 60 ? 'var(--green)' : pct < 90 ? 'var(--yellow)' : 'var(--red)';

      // Summary strip
      const allKeys = Object.keys(data).sort();
      const todayIdx = allKeys.indexOf(today);
      const daysTracked = todayIdx >= 0 ? todayIdx + 1 : allKeys.length;

      let totalSpentAll = 0, totalRolledOver = 0;
      for (const k of allKeys) {
        totalSpentAll += (data[k].spent || []).reduce((s, t) => s + t.amount, 0);
      }
      const todayDay = data[today] || { spent: [], rolloverIn: 0 };
      const todayAvail = DAILY + todayDay.rolloverIn - todayDay.spent.reduce((s,t)=>s+t.amount,0);
      const totalSaved = Math.max(0, todayAvail - DAILY); // accumulated rollover today

      document.getElementById('strip-days').textContent        = daysTracked;
      document.getElementById('strip-saved').textContent       = fmt(data[today]?.rolloverIn || 0);
      document.getElementById('strip-total-spent').textContent = fmt(totalSpentAll);

      // Day label
      const isToday = key === today;
      const isYesterday = key === dateStr(-1);
      let label = formatDate(key);
      if (isToday) label += ' <span class="tag-today">Today</span>';
      if (isYesterday) label = 'Yesterday';
      document.getElementById('day-label').innerHTML = label;

      // Nav buttons
      document.getElementById('btn-next').disabled = isToday;
      const allDates = allDatesAsc();
      document.getElementById('btn-prev').disabled = allDates.length === 0 || key <= allDates[0];

      // Transaction list
      const list = document.getElementById('tx-list');
      list.innerHTML = '';

      if (day.rolloverIn > 0) {
        const el = document.createElement('div');
        el.className = 'tx-item tx-rollover';
        el.innerHTML = `
          <div class="tx-info">
            <div class="tx-desc">Rollover from previous day</div>
            <div class="tx-time">Carried forward</div>
          </div>
          <div class="tx-amount">+${fmt(day.rolloverIn)}</div>`;
        list.appendChild(el);
      }

      if (day.spent.length === 0 && day.rolloverIn === 0) {
        list.innerHTML = '<div class="empty-state">No transactions yet.</div>';
        return;
      }

      day.spent.forEach((tx, i) => {
        const el = document.createElement('div');
        el.className = 'tx-item';
        el.innerHTML = `
          <div class="tx-info">
            <div class="tx-desc">${escHtml(tx.desc || 'Expense')}</div>
            <div class="tx-time">${tx.time}</div>
          </div>
          <div class="tx-amount">-${fmt(tx.amount)}</div>
          ${isToday ? `<button class="btn btn-danger" onclick="deleteExpense(${i})">✕</button>` : ''}`;
        list.appendChild(el);
      });
    }

    function fmt(n) {
      return '$' + Math.abs(n).toFixed(2);
    }

    function escHtml(s) {
      return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    }

    function addExpense() {
      const amtEl  = document.getElementById('amount-input');
      const descEl = document.getElementById('desc-input');
      const amt    = parseFloat(amtEl.value);

      if (!amt || amt <= 0) { showToast('Enter a valid amount.'); return; }

      const today = dateStr(0);
      if (!data[today]) data[today] = { spent: [], rolloverIn: 0 };

      const now = new Date().toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit' });
      data[today].spent.push({ amount: amt, desc: descEl.value.trim(), time: now });

      amtEl.value  = '';
      descEl.value = '';
      viewOffset   = 0;

      save();
      render();
      showToast(`-${fmt(amt)} added`);
    }

    function deleteExpense(idx) {
      const today = dateStr(0);
      if (!data[today]) return;
      data[today].spent.splice(idx, 1);
      save();
      render();
    }

    function changeDay(dir) {
      const allDates = allDatesAsc();
      const key = getViewDate();
      const today = dateStr(0);

      if (dir === 1 && key < today) viewOffset++;
      if (dir === -1 && key > (allDates[0] || today)) viewOffset--;

      render();
    }

    // --- Enter key on inputs ---
    document.getElementById('amount-input').addEventListener('keydown', e => { if (e.key === 'Enter') addExpense(); });
    document.getElementById('desc-input').addEventListener('keydown',  e => { if (e.key === 'Enter') addExpense(); });

    // --- Toast ---
    let toastTimer;
    function showToast(msg) {
      const el = document.getElementById('toast');
      el.textContent = msg;
      el.classList.add('show');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => el.classList.remove('show'), 2200);
    }

    // --- Init ---
    // Ensure today's entry exists
    const todayKey = dateStr(0);
    if (!data[todayKey]) data[todayKey] = { spent: [], rolloverIn: 0 };
    computeRollovers();
    save();
    render();
  </script>
</body>
</html>
